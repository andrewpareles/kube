[package]
name = "render_web"
version.workspace = true
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The website builds this crate twice and loads this build only when the browser gives WebGPU no adapter. It adds
# wgpu's GL backend and render_core's WebGL2 changes.
webgl = ["wgpu/webgl", "render_core/webgl"]

[dependencies]
game_types = { path = "../game_types" }
render_core = { path = "../render_core" }
anyhow = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
glam = "0.33"
wgpu = "27.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.114"
wasm-bindgen-futures = "=0.4.64"
web-sys = { version = "=0.3.91", features = ["HtmlCanvasElement", "console"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.64"

[dev-dependencies]
tokio = { version = "1.43", features = ["macros", "rt", "sync"] }
