[package]
name = "client"
version.workspace = true
edition = "2024"

[dependencies]
uuid = { version = "1.26.0", features = ["v4"] }
game_types = { path = "../game_types" }
render_core = { path = "../render_core" }
shared = { path = "../shared", features = ["client"] }
glam = { version = "0.33", features = ["serde"] }
rapier3d = { version = "0.35.2" }
env_logger = "0.11"
log = "0.4"
anyhow = "1.0"
quinn = "0.11"
rustls = "0.23"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time", "io-util", "sync", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
deno_core = "0.413.0"
winit = "0.30.12"
wgpu = "27.0.1"
ktx2-rw = "0.2.4"
image = { version = "0.25.9", default-features = false, features = ["png"] }
pollster = "0.4.0"
url = "2"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "2.13.0"
cargo-packager-updater = "0.2.3"
open = "5.3"
kira = "0.12.1"

[target.'cfg(target_os = "macos")'.dependencies]
wry = "0.57.0"
libc = "0.2.189"
objc2 = "0.6.3"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["block2", "std", "NSApplication", "NSBitmapImageRep", "NSCursor", "NSGraphics", "NSEvent", "NSImage", "NSImageRep", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", features = ["objc2-core-services"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Devices_HumanInterfaceDevice", "Win32_Foundation", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Gdi", "Win32_Media", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Input", "Win32_UI_Input_Pointer", "Win32_UI_Input_Touch", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.39.1"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1.23"

[dev-dependencies]
rcgen = "0.13"
