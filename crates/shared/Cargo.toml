[package]
name = "shared"
version.workspace = true
edition = "2024"

[features]
client = []
server = []
s3 = ["dep:aws-sdk-s3"]

[dependencies]
game_types = { path = "../game_types" }
render_core = { path = "../render_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "2.13.0"
regex = "1.11"
bincode = "1.3"
glam = { version = "0.33", features = ["serde"] }
rapier3d = { version = "0.35.2" }
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15.7"
anyhow = "1.0"
sha2 = "0.10"
deno_core = "0.413.0"
deno_ast = { version = "0.53.1", features = ["transpiling"] }
deno_error = "0.7.1"
deno_web = "0.291.0"
deno_webidl = "0.260.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time", "io-util", "signal"] }
reqwest = { version = "0.13.1", features = ["blocking", "json", "stream", "gzip"] }
bytemuck = { version = "1.14", features = ["derive"] }
strum = { version = "0.27", features = ["derive"] }
bytes = "1.6"
quinn = "0.11"
time = { version = "0.3", features = ["formatting"] }
im = "15.1.0"
arc-swap = "1.8.2"

schemars = "1"
futures = "0.3"
async-stream = "0.3"
base64 = "0.22"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
gltf = "1.4"
ktx2-rw = "0.2.4"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
uuid = { version = "1.26.0", features = ["v4"] }
aws-sdk-s3 = { version = "1.149", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
home = "0.5"

[dev-dependencies]
wgpu = "27.0.1"
render_web = { path = "../render_web" }
