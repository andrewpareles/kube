[package]
name = "editor_server"
version.workspace = true
edition = "2024"

[dependencies]
uuid = { version = "1.26.0", features = ["v4"] }
linux_sandbox = { path = "linux-sandbox" }
game_types = { path = "../game_types" }
profanity = { path = "../profanity" }
render_core = { path = "../render_core" }
shared = { path = "../shared", features = ["s3"] }
server = { path = "../server" }
client = { path = "../client" }
anyhow = "1"
axum = { version = "0.8", features = ["ws", "multipart"] }
base64 = "0.22"
bincode = "1.3"
env_logger = "0.11"
glam = { version = "0.33", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
pollster = "0.4.0"
reqwest = { version = "0.13", features = ["json"] }
resend-rs = { version = "0.34", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2.13.0", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
time = { version = "0.3", features = ["formatting"] }
tower-http = { version = "0.6", features = ["cors"] }
wgpu = "27.0.1"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "pcm"] }
tempfile = "3.27.0"
vorbis_rs = "0.5"

[dev-dependencies]
render_web = { path = "../render_web" }
