[package]
name = "server"
version.workspace = true
edition = "2024"
default-run = "server"

[dependencies]
game_types = { path = "../game_types" }
profanity = { path = "../profanity" }
shared = { path = "../shared", features = ["server", "s3"] }
bincode = "1.3"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
base64 = "0.22"
quinn = "0.11"
rcgen = "0.13"
rustls = "0.23"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
dotenvy = "0.15.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }

uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
glam = "0.33"
tokio = { version = "1.43", features = ["test-util"] }
