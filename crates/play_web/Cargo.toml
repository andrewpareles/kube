[package]
name = "play_web"
version.workspace = true
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
game_types = { path = "../game_types" }
render_core = { path = "../render_core" }
shared = { path = "../shared" }
anyhow = "1.0"
serde_json = "1.0"
glam = "0.33"
wgpu = "27.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.114"
wasm-bindgen-futures = "=0.4.64"
web-sys = { version = "=0.3.91", features = ["HtmlCanvasElement", "Performance", "Window", "console"] }
