[package]
name = "play_web"
version.workspace = true
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
game_types = { path = "../game_types" }
render_core = { path = "../render_core" }
shared = { path = "../shared" }
anyhow = "1.0"
bincode = "1.3"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = "0.33"
wgpu = "27.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.114"
wasm-bindgen-futures = "=0.4.64"
web-sys = { version = "=0.3.91", features = [
    "HtmlCanvasElement",
    "Performance",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "WebTransport",
    "WebTransportBidirectionalStream",
    "WebTransportCloseInfo",
    "WebTransportDatagramDuplexStream",
    "WebTransportHash",
    "WebTransportOptions",
    "WebTransportReceiveStream",
    "WebTransportSendStream",
    "Window",
    "WritableStream",
    "WritableStreamDefaultWriter",
    "console",
] }
js-sys = "=0.3.91"
# The page needs the channels and locks its connection tasks share with the frame loop, and nothing else.
tokio = { version = "1.43", features = ["sync"] }
