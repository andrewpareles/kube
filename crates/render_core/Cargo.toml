[package]
name = "render_core"
version.workspace = true
edition = "2024"

[features]
# The website's WebGL2 build, for browsers that give WebGPU no adapter. WebGL2 has no sample mask and cannot view one
# texture as two formats, so this build cuts out whole pixels and keeps a second copy of color images.
webgl = []

[dependencies]
game_types = { path = "../game_types" }
anyhow = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
glam = { version = "0.33", features = ["serde"] }
wgpu = "27.0.1"
serde = { version = "1.0", features = ["derive", "rc"] }
log = "0.4"

epaint = "0.33.3"
lucide-icons = "1.21.0"
meshoptimizer-rs = { version = "0.2.1", default-features = false }

[dev-dependencies]
tokio = { version = "1.43", features = ["macros", "rt", "sync"] }
